name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Deploy-tag guard.
  #
  # After the samohost deploy-topology cutover, PRODUCTION ships only on a
  # dated release tag matching samohost's grammar
  # (NikolayS/samohost src/commands/app.ts:1212):
  #
  #     ^v(\d{4})(\d{2})(\d{2})\.([1-9]\d*)$        e.g. v20260904.1
  #
  # Those tags are cut as GitHub Releases (`gh release create`), which fires
  # `release: published` — and would otherwise run this workflow and npm-publish
  # whatever version happens to sit in package.json (0.8.0 today). That is a
  # footgun: a deploy is not a package release.
  #
  # GitHub Actions expressions have no regex, and `startsWith(tag, 'v2')` would
  # also swallow legitimate npm tags like `v2.1.0`. So the match is done in a
  # tiny shell step with a real ERE anchored on the exact samohost grammar, and
  # the publish job gates on its output. `workflow_dispatch` (no release payload)
  # always publishes — that is the manual npm-release path.
  guard:
    name: Check tag is not a deploy tag
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Classify the release tag
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "No release tag in payload (manual dispatch) — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]{8}\.[1-9][0-9]*$'; then
            echo "::notice::Tag '$TAG' is a samohost deploy tag (vYYYYMMDD.N) — skipping npm publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' is not a deploy tag — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish package
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
