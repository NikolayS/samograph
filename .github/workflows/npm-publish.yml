name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing package release tag (must match package.json version)'
        required: true
        type: string
      channel:
        description: 'Explicit npm dist-tag; rc never updates latest'
        required: true
        default: rc
        type: choice
        options: [rc, latest]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  RELEASE_PRERELEASE: ${{ toJSON(github.event.release.prerelease) }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  guard:
    name: Validate package release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Skip only the exact production-deploy grammar: ^v[0-9]{8}\.[1-9][0-9]*$
      - name: Reject missing tags and skip production deploys
        id: deploy
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          if printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]{8}\.[1-9][0-9]*$'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Production deployment tag: no npm publication.'
          fi
      - name: Checkout release tag
        if: steps.deploy.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Pin release commit
        if: steps.deploy.outputs.skip != 'true'
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        if: steps.deploy.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate version and channel
        if: steps.deploy.outputs.skip != 'true'
        id: check
        run: bun scripts/npm-release.ts

  publish:
    name: Publish package
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Revalidate publish channel
        id: validate
        run: bun scripts/npm-release.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Publish
        run: npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.validate.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
